baseURL = "https://neurg.de/"
languageCode = "de"
title = "Neurg — Das WordPress-Theme für Grüne Kreisverbände"

[params]
  description = "Das WordPress-Theme für Grüne Kreisverbände und Ortsverbände. Nach dem Grünen Styleguide 2024, mit Dark Mode. Einfach. Kostenlos. Open Source."
  githubRepo = "https://github.com/neurg-de/kreisverband"

[build]
  [build.buildStats]
    disableClasses = false
    disableIDs = false
    disableTags = false

[minify]
  [minify.tdewolff]
    [minify.tdewolff.html]
      keepWhitespace = false
    [minify.tdewolff.css]
      keepCSS2 = true
