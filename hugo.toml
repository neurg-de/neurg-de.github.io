baseURL = "https://neurg.de/"
languageCode = "de"
title = "Neurg — Das WordPress-Theme für Grüne Verbände"

[params]
  description = "Ein WordPress-Theme für Grüne Verbände und ihre Untergliederungen. Zwei konfigurierbare Ebenen, eigene Bereiche und gemeinsame Verwaltung. Kostenlos und Open Source."
  githubRepo = "https://github.com/neurg-de/kreisverband"

[build]
  [build.buildStats]
    disableClasses = false
    disableIDs = false
    disableTags = false

[minify]
  [minify.tdewolff]
    [minify.tdewolff.html]
      keepWhitespace = false
    [minify.tdewolff.css]
      keepCSS2 = true
